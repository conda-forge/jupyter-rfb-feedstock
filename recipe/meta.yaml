{% set name = "jupyter-rfb" %}
{% set version = "1.0.2" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jupyter_rfb-{{ version }}.tar.gz
  sha256: b77a9a464e2da6d0b345b3989f037c4db2fc0c34da3379b380c42baeb0b3abca

build:
  number: 0
  noarch: python

requirements:

  host:
    - flit
    - pip
    - python {{ python_min }}
  run:
    - numpy
    - anywidget
    - python >={{ python_min }}
    - simplejpeg

test:
  imports:
    - jupyter_rfb
  requires:
    - pip
    - anywidget
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/vispy/jupyter_rfb
  summary: Remote Frame Buffer for Python notebooks
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - kushalkolar
    - djhoese
    - almarklein
